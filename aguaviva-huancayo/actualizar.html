<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actualizar reporte · AguaViva Huancayo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/actualizar.css">
</head>

<body>
    <header>
        <div class="marca"><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z" fill="currentColor" />
            </svg><span>AguaViva Huancayo</span></div>
        <nav><a href="index.html">Inicio</a><a href="registro.html">Reportar fuga</a><a href="consulta.html">Mis
                reportes</a><a href="pago.html">Pagar</a><a href="login.html" id="salir">Cerrar sesión</a></nav>
    </header>
    <main>
        <h1>Actualizar reporte</h1>
        <form id="form-reporte" class="caja" novalidate>
            <p id="codigo"></p>
            <p id="aviso" hidden>Este reporte ya fue pagado o atendido, por eso solo puedes verlo.</p>
            <fieldset id="campos">
                <label for="nombre_vecino">Nombre del vecino</label>
                <input id="nombre_vecino" name="nombre_vecino" type="text" required>
                <label for="direccion">Dirección de la fuga</label>
                <input id="direccion" name="direccion" type="text" required>
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" required></textarea>
                <label for="imagen_url">Enlace de una foto (opcional)</label>
                <input id="imagen_url" name="imagen_url" type="url" placeholder="https://...">
                <label for="diametro_pulg">Diámetro de la tubería (pulgadas)</label>
                <input id="diametro_pulg" name="diametro_pulg" type="number" min="0.25" max="48" step="0.25" value="0.5"
                    required>
                <label for="zona">Zona</label>
                <select id="zona" name="zona">
                    <option value="urbana">Urbana</option>
                    <option value="rural">Rural</option>
                </select>
            </fieldset>
            <button class="btn" id="guardar" type="submit">Guardar cambios</button> <a href="consulta.html">Volver</a>
            <p id="exito" class="exito" role="status" hidden></p>
            <p id="error" class="error" role="alert" hidden></p>
        </form>
    </main>
    <footer>AguaViva Huancayo · Diseño Web NRC 30239 · Jefferson Adauto Asmat</footer>
    <script type="module" src="js/actualizar/actualizar.js"></script>
</body>

</html>
