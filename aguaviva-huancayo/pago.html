<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagar servicio | AguaViva Huancayo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/pago.css">
</head>

<body>
  <header>
    <div class="marca"><svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z" fill="currentColor" />
      </svg><span>AguaViva Huancayo</span></div>
    <nav><a href="index.html">Inicio</a><a href="registro.html">Reportar fuga</a><a href="consulta.html">Mis
        reportes</a><a href="pago.html" class="activo">Pagar</a><a href="login.html" id="salir">Cerrar sesión</a></nav>
  </header>
  <main>
    <h1>Pago en línea</h1>

    <section class="caja" aria-labelledby="t-resumen">
      <h2 id="t-resumen">Resumen</h2>
      <label for="registro">Solicitud a pagar</label>
      <select id="registro" name="registro"></select>
      <p>Total a pagar: <strong id="resumen-monto">—</strong></p>
    </section>

    <fieldset>
      <legend>Método de pago</legend>
      <label><input type="radio" name="metodo" value="tarjeta" checked> Tarjeta de débito o crédito</label>
      <label><input type="radio" name="metodo" value="billetera"> Billetera electrónica</label>
    </fieldset>

    <form id="form-tarjeta" class="caja" novalidate>
      <label for="numero">Número de tarjeta</label>
      <input id="numero" name="numero" inputmode="numeric" autocomplete="cc-number" maxlength="23" required
        aria-describedby="marca-detectada error-numero">
      <span id="marca-detectada"></span>
      <span id="error-numero" class="error"></span>

      <label for="vencimiento">Vencimiento (MM/AA)</label>
      <input id="vencimiento" name="vencimiento" inputmode="numeric" autocomplete="cc-exp" maxlength="5"
        placeholder="MM/AA" required aria-describedby="error-vencimiento">
      <span id="error-vencimiento" class="error"></span>

      <label for="cvv">CVV</label>
      <input id="cvv" name="cvv" type="password" inputmode="numeric" autocomplete="cc-csc" maxlength="4" required
        aria-describedby="error-cvv">
      <span id="error-cvv" class="error"></span>

      <label for="titular">Nombre del titular</label>
      <input id="titular" name="titular" autocomplete="cc-name" required aria-describedby="error-titular">
      <span id="error-titular" class="error"></span>

      <button class="btn" type="submit">Pagar con tarjeta</button>
    </form>

    <form id="form-billetera" class="caja" novalidate hidden>
      <label for="proveedor">Billetera</label>
      <select id="proveedor" name="proveedor">
        <option value="andipay">AndiPay</option>
        <option value="pagomovil">PagoMóvil</option>
      </select>

      <label for="celular">Celular afiliado</label>
      <input id="celular" name="celular" inputmode="numeric" autocomplete="tel-national" maxlength="9" required
        aria-describedby="error-celular">
      <span id="error-celular" class="error"></span>

      <label for="codigo">Código de aprobación (6 dígitos que muestra tu billetera)</label>
      <input id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required
        aria-describedby="error-codigo">
      <span id="error-codigo" class="error"></span>

      <button class="btn" type="submit">Pagar con billetera</button>
    </form>

    <p id="mensaje-pago" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="js/pago/pago.js"></script>
  <footer>AguaViva Huancayo · Diseño Web NRC 30239 · Jefferson Adauto Asmat</footer>
</body>

</html>
